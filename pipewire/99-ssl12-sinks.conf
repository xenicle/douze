# douze — découpe le sink 8 canaux de la SSL 12 (profil Pro Audio) en
# 4 sinks stéréo, un par paire Playback. Les applis ciblent une paire ;
# le routage final (monitor, casques, line 3-4) se fait dans le mixer
# hardware via sslctl (matrice de gains, cf. PROTOCOL.md).
#
# ⚠️ MODÈLE : `@SSL12_NODE@` doit être remplacé par le nom du nœud ALSA de VOTRE
# carte — il contient son numéro de série, donc il diffère d'une machine à
# l'autre. `tools/install-pipewire.sh` le trouve et écrit le fichier final.
#
# À la main :
#   pw-link -o | grep -o 'alsa_output.usb-Solid_State_Logic_SSL_12_[^:]*' | head -1
#   sed "s|@SSL12_NODE@|<ce nom>|g" pipewire/99-ssl12-sinks.conf \
#     > ~/.config/pipewire/pipewire.conf.d/99-ssl12-sinks.conf
#   systemctl --user restart pipewire

context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "SSL 12 Playback 1-2 (Mix)"
      capture.props = {
        node.name    = "ssl12.pb12"
        media.class  = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name    = "ssl12.pb12.out"
        audio.position = [ AUX0 AUX1 ]
        target.object = "@SSL12_NODE@"
        node.dont-reconnect = true
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "SSL 12 Playback 3-4"
      capture.props = {
        node.name    = "ssl12.pb34"
        media.class  = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name    = "ssl12.pb34.out"
        audio.position = [ AUX2 AUX3 ]
        target.object = "@SSL12_NODE@"
        node.dont-reconnect = true
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "SSL 12 Playback 5-6"
      capture.props = {
        node.name    = "ssl12.pb56"
        media.class  = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name    = "ssl12.pb56.out"
        audio.position = [ AUX4 AUX5 ]
        target.object = "@SSL12_NODE@"
        node.dont-reconnect = true
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "SSL 12 Playback 7-8"
      capture.props = {
        node.name    = "ssl12.pb78"
        media.class  = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name    = "ssl12.pb78.out"
        audio.position = [ AUX6 AUX7 ]
        target.object = "@SSL12_NODE@"
        node.dont-reconnect = true
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
]
