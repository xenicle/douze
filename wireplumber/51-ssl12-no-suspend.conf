# Douze — ne jamais mettre en veille les nœuds ALSA de la SSL 12.
#
# Pourquoi : les quatre loopbacks de pipewire/99-ssl12-sinks.conf sont des
# liens PASSIFS. Dès que plus rien ne joue (Discord silencieux, pas de
# musique), la sortie SSL n'a plus aucun lien actif, passe « idle » et
# WirePlumber la suspend après 5 s (défaut de scripts/node/suspend-node.lua).
# Au premier son, le flux ALSA de lecture repart — alors que la capture
# (tenue en permanence par la bande FX micro) tourne depuis le boot — et
# PipeWire, qui pilote la lecture comme « follower » de la capture, la
# retrouve décalée d'une période : il « resync » à chaque cycle, en
# oscillant entre 10 et ~1000 échantillons sans jamais converger
# (journal : « spa.alsa: hw:N,0p: follower avail:10|1009 … resync »).
# À l'oreille : craquements, voix des interlocuteurs hachée (16/09, 26/09,
# 30/09/2026).
#
# Installation : copier dans ~/.config/wireplumber/wireplumber.conf.d/ puis
#   systemctl --user restart pipewire pipewire-pulse wireplumber
# (PipeWire entier : les loopbacks sont en dont-reconnect, un WirePlumber seul
# recréerait les nœuds SSL sans que pb12/pb34 s'y rattachent. Les bandes
# Douze FX se relancent seules ; Vesktop est à relancer.)
# Remède d'urgence sans rien installer : le même restart. Ne PAS envoyer
# « Suspend » au nœud à la main : il revient avec un canal mort (30/09).
# Vérifier : pw-cli info <id de alsa_output…SSL_12…pro-output-0>
#   → session.suspend-timeout-seconds = "0"
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_(output|input)\\.usb-Solid_State_Logic_SSL_12.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
